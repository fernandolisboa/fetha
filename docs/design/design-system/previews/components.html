<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Fetha · componentes</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Source+Sans+3:wght@400;500;600&family=Source+Code+Pro:wght@400;500&display=swap"><style>/* Fetha design tokens. Canonical source: DESIGN.md. Themes are per-user (ADR-0015). */

:root[data-theme="instrumento"] {
  --bg: #0f1115; --surface: #151922; --surface-2: #1a1f29; --line: #262c38; --line-soft: #1f2430;
  --ink: #e6e8ee; --muted: #8d97a8; --faint: #7a8598;
  --accent: #3fb8c8; --accent-hover: #62c9d6; --accent-ink: #06181b; --accent-soft: #12303a;

  --font-display: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; --font-body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; --font-mono: 'IBM Plex Mono', Consolas, monospace;
  --radius: 4px; --elevation: none; --density-body: 13px; --density-row: 36px; --chart-stroke: var(--accent);
}
:root[data-theme="terminal"] {
  --bg: #0a0b0d; --surface: #0a0b0d; --surface-2: #111317; --line: #22262c; --line-soft: #181b20;
  --ink: #d7d9de; --muted: #8a9099; --faint: #747b85;
  --accent: #e0a83a; --accent-hover: #f0bd5c; --accent-ink: #15120a; --accent-soft: #2a2110;
  --up: #3ddc84; --down: #ff5c5c; --warning: #e0a83a; --danger: #ff5c5c;
  --greek-delta: #e0a83a; --greek-gamma: #b0b6c0; --greek-theta: #f0bd5c; --greek-vega: #7d8794;
  --font-display: 'JetBrains Mono', Consolas, monospace; --font-body: 'JetBrains Mono', Consolas, monospace; --font-mono: 'JetBrains Mono', Consolas, monospace;
  --radius: 0px; --elevation: none; --density-body: 12px; --density-row: 32px; --chart-stroke: var(--ink);
}
:root[data-theme="amplo"] {
  --bg: #13151b; --surface: #191c24; --surface-2: #1f232d; --line: #2a2f3b; --line-soft: #232833;
  --ink: #ebe7dd; --muted: #a39d90; --faint: #8c8679;
  --accent: #c9a25a; --accent-hover: #dcb66c; --accent-ink: #1a1509; --accent-soft: #2f2916;
  --up: #6fbf8f; --down: #d9776f; --warning: #c9a25a; --danger: #e0736a;
  --greek-delta: #c9a25a; --greek-gamma: #b494cf; --greek-theta: #e0b46b; --greek-vega: #7fa3c2;
  --font-display: 'Source Serif 4', Georgia, serif; --font-body: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif; --font-mono: 'Source Code Pro', Consolas, monospace;
  --radius: 8px; --elevation: none; --density-body: 14px; --density-row: 40px; --chart-stroke: var(--ink);
}

body{margin:0;background:#0f1115;color:#e6e8ee;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px}
.theme{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--density-body);padding:20px;display:grid;gap:12px}
.sw{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.sw div{height:56px;border:1px solid var(--line);border-radius:var(--radius);display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:10px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
h2{margin:0;font-family:var(--font-display);font-size:16px;font-weight:600}
</style></head><body style="width:900px"><section class="theme" style="--bg:#0f1115;--surface:#151922;--surface-2:#1a1f29;--line:#262c38;--ink:#e6e8ee;--muted:#8d97a8;--faint:#7a8598;--accent:#3fb8c8;--accent-ink:#06181b;--up:#2fb36a;--down:#e0524f;--warning:#e0a83a;--font-body:'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;--font-mono:'IBM Plex Mono', Consolas, monospace;--font-display:'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;--radius:4px;--density-body:13px">
<h2>Componentes (Instrumento)</h2>
<div style="display:flex;gap:8px"><div style="padding:9px 16px;border-radius:var(--radius);background:var(--accent);color:var(--accent-ink);font-weight:500">Analisar com IA</div><div style="padding:9px 16px;border-radius:var(--radius);border:1px solid var(--line)">Salvar operação</div><div style="padding:9px 16px;border-radius:var(--radius);border:1px solid var(--accent);color:var(--accent)">Entrar</div></div>
<div style="border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)"><div style="padding:8px 12px;font-weight:500">Resultado</div><div style="padding:10px 12px;border-top:1px solid var(--line)"><div style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)">Perda máxima</div><div class="mono" style="font-size:18px;color:var(--down)">− R$ 2.080,00</div><div style="font-size:12px;color:var(--muted)">2,08% do capital declarado</div></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr 1.4fr 1fr 1fr;gap:12px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)" class="mono"><span style="color:var(--down)">Venda</span><span style="text-align:right">1.000</span><span>PETRJ400</span><span style="text-align:right">40,00</span><span style="text-align:right">0,92</span></div>
<div style="display:flex;gap:10px;padding:10px 12px;border:1px solid var(--warning);border-radius:var(--radius);background:var(--surface);font-size:12px"><span style="color:var(--warning);font-weight:500">Fura o perfil de risco.</span><span>Você pode registrar a decisão mesmo assim; o furo fica anotado.</span></div>
</section></body></html>
