name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: "Check workflow uses: are pinned to a commit sha"
        run: node scripts/check-workflow-pins.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (unit, property-based, engine coverage gate)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Drizzle check
        run: pnpm db:check

      - name: Impeccable detect
        run: |
          set -e
          git fetch origin main --depth=1 || true
          CHANGED=$(git diff --name-only --diff-filter=AMR origin/main...HEAD -- 'apps/web/src/**/*.tsx' 'apps/web/src/**/*.css' || true)
          if [ -z "$CHANGED" ]; then
            echo "No changed .tsx/.css files under apps/web/src; skipping Impeccable detect."
            exit 0
          fi
          echo "$CHANGED"
          npx --yes impeccable@4.1.0 detect $CHANGED

  preview-database:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      deployments: read
      pull-requests: read
      statuses: read
    concurrency:
      group: preview-db
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check preview database secret
        id: preview-db
        env:
          DATABASE_URL_PREVIEW: ${{ secrets.DATABASE_URL_PREVIEW }}
        run: |
          if [ -n "$DATABASE_URL_PREVIEW" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reset the shared preview database
        if: steps.preview-db.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
          DATABASE_RESET_ALLOWED_HOST: ${{ vars.DATABASE_RESET_ALLOWED_HOST }}
          DATABASE_PRODUCTION_HOST: ${{ vars.DATABASE_PRODUCTION_HOST }}
        run: pnpm --filter @fetha/web run db:reset

      - name: Migrate the shared preview database
        if: steps.preview-db.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
          DATABASE_RESET_ALLOWED_HOST: ${{ vars.DATABASE_RESET_ALLOWED_HOST }}
          DATABASE_PRODUCTION_HOST: ${{ vars.DATABASE_PRODUCTION_HOST }}
        run: pnpm --filter @fetha/web run db:migrate

      - name: Seed the structure catalog
        if: steps.preview-db.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
          DATABASE_RESET_ALLOWED_HOST: ${{ vars.DATABASE_RESET_ALLOWED_HOST }}
          DATABASE_PRODUCTION_HOST: ${{ vars.DATABASE_PRODUCTION_HOST }}
        run: pnpm --filter @fetha/web run db:seed-structures

      # The owner-gated e2e specs sign this account in by magic link, which
      # never creates an account (docs/adr/0042); the reset above dropped it.
      - name: Seed the e2e owner account
        if: steps.preview-db.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
          DATABASE_RESET_ALLOWED_HOST: ${{ vars.DATABASE_RESET_ALLOWED_HOST }}
          DATABASE_PRODUCTION_HOST: ${{ vars.DATABASE_PRODUCTION_HOST }}
        run: pnpm --filter @fetha/web run db:seed-e2e-owner

      - name: Check e2e prerequisites
        id: e2e-prereqs
        if: github.event_name == 'pull_request'
        env:
          E2E_SECRET: ${{ secrets.E2E_SECRET }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          if [ -n "$E2E_SECRET" ] && [ -n "$VERCEL_PROTECTION_BYPASS" ] \
            && [ "${{ steps.preview-db.outputs.configured }}" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the Vercel preview deployment
        id: wait-preview
        if: github.event_name == 'pull_request' && steps.e2e-prereqs.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/wait-for-vercel-preview.mjs

      - name: Install Playwright browsers
        if: steps.wait-preview.outputs.url != ''
        run: pnpm --filter @fetha/web exec playwright install --with-deps chromium

      - name: Run the Playwright e2e suite against the PR preview
        if: steps.wait-preview.outputs.url != ''
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.wait-preview.outputs.url }}
          E2E_SECRET: ${{ secrets.E2E_SECRET }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: pnpm --filter @fetha/web test:e2e --reporter=list

  ci-images:
    runs-on: ubuntu-latest
    outputs:
      postgres: ${{ steps.images.outputs.postgres }}
      neon-proxy: ${{ steps.images.outputs.neon-proxy }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/ci-images
          sparse-checkout-cone-mode: false

      # Reads FROM lines from the stub Dockerfile (never built) so the
      # digests it pins stay the single source of truth Dependabot can bump;
      # see .github/ci-images/Dockerfile for why.
      - name: Parse pinned CI image digests
        id: images
        run: .github/ci-images/parse-image.sh

  integration:
    needs: ci-images
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ needs.ci-images.outputs.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: main
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      neon-proxy:
        image: ${{ needs.ci-images.outputs.neon-proxy }}
        env:
          PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/main
        ports:
          - 4444:4444
    env:
      DATABASE_URL: postgres://postgres:postgres@db.localtest.me:5432/main
      ALLOW_DISPOSABLE_DATABASE: "1"
      DATABASE_PRODUCTION_HOST: ${{ vars.DATABASE_PRODUCTION_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pin db.localtest.me to the loopback address
        run: echo "127.0.0.1 db.localtest.me" | sudo tee -a /etc/hosts

      - name: Wait for the local Neon proxy
        run: timeout 60 bash -c 'until curl -s -o /dev/null http://localhost:4444/; do sleep 1; done'

      # The proxy image creates this table on start-up, but as a service it can
      # start before Postgres accepts connections and then skip it.
      - name: Register the local Neon proxy's endpoint table
        run: >-
          psql postgres://postgres:postgres@localhost:5432/main -v ON_ERROR_STOP=1
          -c "CREATE SCHEMA IF NOT EXISTS neon_control_plane"
          -c "CREATE TABLE IF NOT EXISTS neon_control_plane.endpoints
          (endpoint_id VARCHAR(255) PRIMARY KEY, allowed_ips VARCHAR(255))"

      - name: Migrate the local database
        run: pnpm --filter @fetha/web run db:migrate

      - name: Seed the structure catalog
        run: pnpm --filter @fetha/web run db:seed-structures

      - name: Integration tests
        env:
          BETTER_AUTH_SECRET: ci-integration-secret-ci-integration-secret
          BETTER_AUTH_URL: http://localhost:3000
        run: pnpm --filter @fetha/web run test:integration
